name: DevSecOps CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-test-scan:
    runs-on: ubuntu-latest

    steps:

      # -----------------------------
      # Checkout Source Code
      # -----------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -----------------------------
      # Setup Python
      # -----------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # -----------------------------
      # Install Dependencies
      # -----------------------------
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -----------------------------
      # Run Unit Tests
      # -----------------------------
      - name: Run Unit Tests
        run: |
          pytest --cov=app

      # -----------------------------
      # Build Docker Image
      # -----------------------------
      - name: Build Docker Image
        run: |
          docker build -t devsecops-pipeline:latest .

      # -----------------------------
      # Install Trivy
      # -----------------------------
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

      # -----------------------------
      # Run Trivy Scan
      # -----------------------------
      - name: Run Trivy Scan
        run: |
          mkdir -p reports

          trivy image \
            --format json \
            --output reports/trivy-report.json \
            devsecops-pipeline:latest

      # -----------------------------
      # Start Application
      # -----------------------------
      - name: Start Application
        run: |
          docker run -d \
            --name devsecops-app \
            -p 5000:5000 \
            devsecops-pipeline:latest

      # -----------------------------
      # Wait Until Application Starts
      # -----------------------------
      - name: Wait for Application
        run: |
          for i in {1..20}; do
            if curl -f http://localhost:5000/health; then
              echo "Application is ready."
              exit 0
            fi

            echo "Waiting for application..."
            sleep 2
          done

          echo "Application failed to start."
          docker logs devsecops-app || true
          exit 1

      # -----------------------------
      # Verify Application
      # -----------------------------
      - name: Verify Application
        run: |
          curl -v http://localhost:5000/health

      # -----------------------------
      # Run OWASP ZAP Baseline Scan
      # -----------------------------
      - name: Run OWASP ZAP Baseline Scan
        run: |
          docker run --rm \
            --user root \
            --network host \
            -v ${{ github.workspace }}/reports:/zap/wrk:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:5000 \
            -J zap-report.json \
            -I

      # -----------------------------
      # Run Policy Engine
      # -----------------------------
      - name: Run Policy Engine
        run: |
          python scripts/policy_engine.py

      # -----------------------------
      # Stop Application
      # -----------------------------
      - name: Stop Application
        if: always()
        run: |
          docker stop devsecops-app || true
          docker rm devsecops-app || true

      # -----------------------------
      # Upload Security Reports
      # -----------------------------
      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/